name: "Python Formatting"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  format:
    # Job keeps the original "black"/"isort" matrix values (and this explicit name, keyed
    # only on matrix.tool) so the required status checks "format (black)" / "format (isort)"
    # keep reporting under their old names, even though both now run ruff underneath.
    # Renaming them would require updating the branch ruleset's required-check list too.
    name: "format (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: black
            command: "ruff format --check ."
          - tool: isort
            command: "ruff check --select I ."
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group linting
      - name: ${{ matrix.tool }} Code Formatter
        run: uv run ${{ matrix.command }}
