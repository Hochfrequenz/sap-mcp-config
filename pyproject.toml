[project]
name = "sap-mcp-config"
description = "Shared configuration models for MCP servers that connect to SAP systems"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["sap", "mcp", "configuration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2",
    "python-dotenv>=1",
    "PyYAML>=6",
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/sap-mcp-config/releases"
Homepage = "https://github.com/Hochfrequenz/sap-mcp-config"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR0912", "PLR0915", "PLR2004"]

[tool.mypy]
disable_error_code = []
plugins = ["pydantic.mypy"]

[dependency-groups]
tests = [
    "pytest==9.1.1",
]
linting = [
    "ruff==0.16.2",
    {include-group = "tests"},
]
type_check = [
    "mypy==2.3.0",
    "types-PyYAML>=6",
    {include-group = "tests"},
]
spell_check = [
    "codespell==2.4.3",
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"},
]
dev = [
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spell_check"},
    {include-group = "coverage"},
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_sap_mcp_config_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
